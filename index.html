<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Robô TikTok Shop V3</title>
<style>
:root{--bg:#0b0d12;--card:#171a22;--line:#2c313c;--accent:#4d90fe;--text:#e0e4eb;--muted:#88909f}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,sans-serif}
header{padding:18px 16px;border-bottom:1px solid var(--line)}
h1{font-size:21px;margin:0 4px}
.sub{font-size:13px;color:var(--muted);margin-top:4px}
main{max-width:980px;margin:auto;padding:15px}
.card{background:var(--card);border-radius:14px;padding:20px;margin-bottom:16px;border:1px solid var(--line)}
h2{font-size:17px;margin:0 0 14px 0;color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
input,select,textarea{width:100%;background:#0e1018;border:1px solid var(--line);border-radius:8px;padding:10px 12px;color:var(--text);font-size:15px}
button{border:0;border-radius:11px;padding:11px 14px;font-size:15px;font-weight:600;background:var(--accent);color:#fff;cursor:pointer}
button:disabled{opacity:0.5;cursor:not-allowed}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
pre{white-space:pre-wrap;line-height:1.5;background:#0e1018;padding:12px;border-radius:8px;margin-top:12px;font-size:13px}
.progress{height:9px;background:#0d0f13;border-radius:6px;overflow:hidden;margin:12px 0;display:none}
.progress-bar{height:100%;width:0%;background:var(--accent);transition:width 0.3s}
.result{border:1px solid var(--line);border-radius:10px;padding:14px;margin-top:14px;display:none}
.success{border-color:#2ecc71;background:rgba(46,204,113,0.08)}
.error{border-color:#e74c3c;background:rgba(231,76,60,0.08)}
</style>
</head>
<body>
<header>
  <h1>🤖 Robô TikTok Shop V3</h1>
    <div class="sub">Gera vídeos automaticamente</div>
    </header>
    <main>
      <div class="card">
          <h2>🛍️ Produto</h2>
              <div class="grid">
                    <div><label>Nome</label><input id="product" placeholder="Ex: Relógio inteligente"></div>
                          <div><label>Preço</label><input id="price" placeholder="Ex: 39,90"></div>
                                <div><label>Público</label><input id="audience" placeholder="Ex: mulheres 25-45"></div>
                                      <div>
                                              <label>Estilo</label>
                                                      <select id="style">
                                                                <option value="divertido">Divertido</option>
                                                                          <option value="profissional">Profissional</option>
                                                                                    <option value="urgente">Urgente/Oferta</option>
                                                                                              <option value="historia">História/Emocional</option>
                                                                                                      </select>
                                                                                                            </div>
                                                                                                                  <div>
                                                                                                                          <label>Quantidade de vídeos</label>
                                                                                                                                  <select id="count">
                                                                                                                                            <option value="1">1 vídeo</option>
                                                                                                                                                      <option value="3">3 vídeos</option>
                                                                                                                                                                <option value="5">5 vídeos</option>
                                                                                                                                                                          <option value="10">10 vídeos</option>
                                                                                                                                                                                  </select>
                                                                                                                                                                                        </div>
                                                                                                                                                                                            </div>
                                                                                                                                                                                                <div class="actions">
                                                                                                                                                                                                      <button id="gerar">🚀 Gerar Vídeos</button>
                                                                                                                                                                                                            <button id="limpar" style="background:#2c313c">🗑️ Limpar</button>
                                                                                                                                                                                                                </div>
                                                                                                                                                                                                                    <div class="progress" id="progress">
                                                                                                                                                                                                                          <div class="progress-bar" id="bar"></div>
                                                                                                                                                                                                                              </div>
                                                                                                                                                                                                                                  <div class="result" id="result"></div>
                                                                                                                                                                                                                                    </div>
                                                                                                                                                                                                                                    </main>

                                                                                                                                                                                                                                    <script>
                                                                                                                                                                                                                                    const btn = document.getElementById('gerar');
                                                                                                                                                                                                                                    const limpar = document.getElementById('limpar');
                                                                                                                                                                                                                                    const progress = document.getElementById('progress');
                                                                                                                                                                                                                                    const bar = document.getElementById('bar');
                                                                                                                                                                                                                                    const result = document.getElementById('result');

                                                                                                                                                                                                                                    btn.addEventListener('click', async () => {
                                                                                                                                                                                                                                      const product = document.getElementById('product').value.trim();
                                                                                                                                                                                                                                        const price = document.getElementById('price').value.trim();
                                                                                                                                                                                                                                          const audience = document.getElementById('audience').value.trim();
                                                                                                                                                                                                                                            const style = document.getElementById('style').value;
                                                                                                                                                                                                                                              const count = parseInt(document.getElementById('count').value);

                                                                                                                                                                                                                                                if (!product || !price || !audience) {
                                                                                                                                                                                                                                                    alert('Preencha Nome, Preço e Público!');
                                                                                                                                                                                                                                                        return;
                                                                                                                                                                                                                                                          }

                                                                                                                                                                                                                                                            btn.disabled = true;
                                                                                                                                                                                                                                                              btn.textContent = '⏳ Gerando...';
                                                                                                                                                                                                                                                                progress.style.display = 'block';
                                                                                                                                                                                                                                                                  result.style.display = 'none';
                                                                                                                                                                                                                                                                    bar.style.width = '0%';

                                                                                                                                                                                                                                                                      try {
                                                                                                                                                                                                                                                                          const res = await fetch('/api/generate-video', {
                                                                                                                                                                                                                                                                                method: 'POST',
                                                                                                                                                                                                                                                                                      headers: { 'Content-Type': 'application/json' },
                                                                                                                                                                                                                                                                                            body: JSON.stringify({ product, price, audience, style, count })
                                                                                                                                                                                                                                                                                                });

                                                                                                                                                                                                                                                                                                    bar.style.width = '50%';

                                                                                                                                                                                                                                                                                                        const data = await res.json();

                                                                                                                                                                                                                                                                                                            bar.style.width = '100%';

                                                                                                                                                                                                                                                                                                                if (!res.ok) throw new Error(data.error || 'Erro na requisição');

                                                                                                                                                                                                                                                                                                                    result.className = 'result success';
                                                                                                                                                                                                                                                                                                                        result.innerHTML = `<strong>✅ Sucesso!</strong><br><br>
                                                                                                                                                                                                                                                                                                                              ${data.message || 'Vídeos gerados com sucesso'}<br>
                                                                                                                                                                                                                                                                                                                                    Recebido: ${data.promptRecebido || '(ok)'}<br>
                                                                                                                                                                                                                                                                                                                                          <a href="${data.videoUrl || '#'}" target="_blank" style="color:#4d90fe">🔗 Ver vídeo</a>`;
                                                                                                                                                                                                                                                                                                                                              result.style.display = 'block';

                                                                                                                                                                                                                                                                                                                                                } catch (err) {
                                                                                                                                                                                                                                                                                                                                                    result.className = 'result error';
                                                                                                                                                                                                                                                                                                                                                        result.innerHTML = `<strong>❌ Erro</strong><br><br>${err.message}`;
                                                                                                                                                                                                                                                                                                                                                            result.style.display = 'block';
                                                                                                                                                                                                                                                                                                                                                              } finally {
                                                                                                                                                                                                                                                                                                                                                                  btn.disabled = false;
                                                                                                                                                                                                                                                                                                                                                                      btn.textContent = '🚀 Gerar Vídeos';
                                                                                                                                                                                                                                                                                                                                                                          setTimeout(() => { progress.style.display = 'none'; bar.style.width = '0%'; }, 2000);
                                                                                                                                                                                                                                                                                                                                                                            }
                                                                                                                                                                                                                                                                                                                                                                            });

                                                                                                                                                                                                                                                                                                                                                                            limpar.addEventListener('click', () => {
                                                                                                                                                                                                                                                                                                                                                                              document.getElementById('product').value = '';
                                                                                                                                                                                                                                                                                                                                                                                document.getElementById('price').value = '';
                                                                                                                                                                                                                                                                                                                                                                                  document.getElementById('audience').value = '';
                                                                                                                                                                                                                                                                                                                                                                                    result.style.display = 'none';
                                                                                                                                                                                                                                                                                                                                                                                    });
                                                                                                                                                                                                                                                                                                                                                                                    </script>
                                                                                                                                                                                                                                                                                                                                                                                    </body>
                                                                                                                                                                                                                                                                                                                                                                                    </html>
